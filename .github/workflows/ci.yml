# CI for the HorekBazar template (BUILD-PLAN B0, B1): lint, typecheck, unit tests, catalogue
# checks, a production build with zero environment variables, the Playwright suite in Chromium,
# Firefox and WebKit (WebKit through the test-only HTTPS proxy), and a client-bundle secret scan
# on a second build with harmless canary values.
# B1: actions/checkout v4 -> v7 and actions/setup-node v4 -> v7 (both run on Node 24; the
# Node 20 action runtime is deprecated). Runner pinned to ubuntu-24.04 while ubuntu-latest moves
# to a newer image, so Playwright's --with-deps keeps a known package set.
# B2: validator drift check (domain-rules §14 check 1) and the integration suite against a
# disposable MongoDB 8.0 replica set from mongodb-memory-server (checks 2 and 3, outbox, topology).
# The mongod binary is cached between runs; the suite never sees a real database URI.
# B4: signed-in admin catalogue journeys in Chromium against the zero-variable build, backed by a
# disposable in-memory replica set (playwright.db.config.ts, scripts/e2e-db-server.mjs).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Generated MongoDB validators match the committed files
        run: npm run db:validators -- --check
      - name: Cache the test mongod binary
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-8.0.4-ubuntu-24.04
      - name: Integration tests (disposable replica set)
        env:
          MONGOMS_VERSION: 8.0.4
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
        run: npm run test:integration
      - run: npm run catalogue:validate
      - run: npm run catalogue:schema

      - name: Build with zero environment variables
        run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright (375 / 768 / 1440, three engines)
        run: npm run test:e2e
      - name: Signed-in admin journeys (Chromium, disposable replica set)
        env:
          MONGOMS_VERSION: 8.0.4
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
        run: npm run test:e2e:db
      - name: Keep the Playwright report when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Build with canary server-only values
        env:
          MONGODB_URI: mongodb://ci-canary-user:ci-canary-pass-7f3a@ci-canary.invalid/db
          AUTH_SECRET: ci-canary-auth-secret-0123456789abcdef0123
          UPSTASH_REDIS_REST_TOKEN: ci-canary-upstash-token-9d2e
          CLOUDINARY_API_SECRET: ci-canary-cloudinary-secret-4b1c
          RESEND_API_KEY: ci-canary-resend-key-8a6f
          GEMINI_API_KEY: ci-canary-gemini-key-2c7d
          CRON_SECRET: ci-canary-cron-secret-5e9b
        run: npm run build && npm run check:bundle
